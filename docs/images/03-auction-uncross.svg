<text x="58" y="590" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">COLL_B buys the print from OWNER_1 at £4,500 (one price for the whole auction). COLL_A (£4,450) and COLL_C (£4,380) keep</text>
<text x="58" y="609" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">waiting as bids in continuous trading. They are DAY orders, so they expire at 20:30. The same method runs the 20:05 closing auction.</text>
