<text x="414" y="368" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">How the price is chosen (each rule only breaks ties left by the one before):</text>
<text x="414" y="392" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">1. Trade the most items → £4,400, £4,450 and £4,500 tie (1 each)</text>
<text x="414" y="414" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">2. Leave the fewest unmatched → £4,500 wins (0 left over)</text>
<text x="414" y="436" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">3. Still tied? Follow the pressure: more buyers → the higher price</text>
<text x="414" y="458" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">4. Still tied? Pick the price closest to the reference price</text>
<line x1="500" y1="516" x2="500" y2="540" stroke="#475569" stroke-width="2" marker-end="url(#arr475569)"/>
<rect x="40" y="542" width="920" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
