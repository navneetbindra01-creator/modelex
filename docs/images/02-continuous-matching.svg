<text x="688" y="519" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">Bordeaux 2010 at £3,200, then sends</text>
