[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "modelex"
version = "0.1.0"
description = "Open-source configurable model exchange for model-based testing (equities, crypto, commodities, collectibles)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License",
               "Topic :: Software Development :: Testing", "Topic :: Office/Business :: Financial :: Investment"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
modelex = "modelex.__main__:main"

[tool.setuptools.packages.find]
include = ["modelex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
